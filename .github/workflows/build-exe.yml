name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Install base tools + Python 3.11
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential software-properties-common \
            patchelf
          # 安装 Python 3.11（deadsnakes PPA）
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3.11 python3.11-venv python3.11-distutils
          python3.11 --version

      - name: Install pip for Python 3.11 (get-pip.py)
        run: |
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3.11 /tmp/get-pip.py --ignore-installed
          python3.11 -m pip --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js 20 (NodeSource)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Print pip index/config (debug)
        run: |
          set -x
          python3.11 -m pip config list -v || true
          python3.11 -m pip debug -v | sed -n '/Index URLs/,+30p' || true
          env | grep -E '^PIP_' || true

      - name: Install Python dependencies (force PyPI index)
        working-directory: package
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install --no-binary :pyinstaller: pyinstaller
          python3.11 -m pip install --index-url https://pypi.org/simple -r requirements.txt

      - name: Install frontend dependencies
        working-directory: package/frontend
        run: npm ci

      - name: Build frontend
        working-directory: package/frontend
        run: npm run build

      - name: Copy frontend build to static
        working-directory: package
        run: |
          rm -rf static
          cp -r frontend/dist static

      - name: Build with PyInstaller
        working-directory: package
        run: python3.11 -m PyInstaller app.spec --clean

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Create tar archive
        working-directory: package
        run: |
          version="${{ steps.version.outputs.version }}"
          tar -czvf "AI学术写作助手-Linux-${version}.tar.gz" -C dist "AI学术写作助手"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI学术写作助手-Linux-${{ steps.version.outputs.version }}
          path: package/AI学术写作助手-Linux-*.tar.gz
          retention-days: 30

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
