name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

# Default permissions for all jobs
permissions:
  contents: read

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: '14.0'
          prepare: |
            pkg install -y python311 py311-pip node20 npm-node20 bash \
              libxml2 libxslt py311-lxml pkgconf \
              rust cargo gmake gcc
            python3.11 -m ensurepip
          run: |
            cd package

            # 设置环境变量
            export PATH="/usr/local/bin:$PATH"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true

            # 安装 Python 依赖
            python3.11 -m pip install --upgrade pip setuptools wheel
            python3.11 -m pip install pyinstaller

            # 分步安装依赖，优先使用预编译包
            python3.11 -m pip install --only-binary=:all: typing-extensions annotated-types || \
            python3.11 -m pip install typing-extensions annotated-types

            # 安装其余依赖
            python3.11 -m pip install -r requirements.txt || {
              echo "部分依赖安装失败，尝试使用 --no-binary 选项"
              python3.11 -m pip install --no-binary pydantic-core -r requirements.txt
            }

            # 安装前端依赖
            cd frontend
            npm ci
            npm run build
            cd ..

            # 复制前端构建产物
            rm -rf static
            cp -r frontend/dist static

            # 使用 PyInstaller 打包
            python3.11 -m PyInstaller app.spec --clean

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Create tar archive
        run: |
          cd package
          version="${{ steps.version.outputs.version }}"
          tar -czvf "AI学术写作助手-FreeBSD-${version}.tar.gz" -C dist "AI学术写作助手"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI学术写作助手-FreeBSD-${{ steps.version.outputs.version }}
          path: package/AI学术写作助手-FreeBSD-*.tar.gz
          retention-days: 30

  release:
    needs: [build-freebsd]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
