name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

# Default permissions for all jobs
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential \
            python3 python3-venv python3-pip \
            patchelf
          python3 --version
          pip3 --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js 20 (NodeSource)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Install Python dependencies
        working-directory: package
        run: |
          python3 -m pip install --upgrade pip
          # 建议：避免拿到不兼容的预编译 PyInstaller 组件，改用源码安装
          pip install --no-binary :pyinstaller: pyinstaller
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: package/frontend
        run: npm ci

      - name: Build frontend
        working-directory: package/frontend
        run: npm run build

      - name: Copy frontend build to static
        working-directory: package
        run: |
          rm -rf static
          cp -r frontend/dist static

      - name: Build with PyInstaller
        working-directory: package
        run: pyinstaller app.spec --clean

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Create tar archive
        working-directory: package
        run: |
          version="${{ steps.version.outputs.version }}"
          tar -czvf "AI学术写作助手-Linux-${version}.tar.gz" -C dist "AI学术写作助手"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI学术写作助手-Linux-${{ steps.version.outputs.version }}
          path: package/AI学术写作助手-Linux-*.tar.gz
          retention-days: 30

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
