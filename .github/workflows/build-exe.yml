name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
  
    defaults:
      run:
        shell: bash
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      # ====== 只替换这里：Setup Python ======
      - name: Setup Python (3.9+ inside ubuntu:20.04 container)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl software-properties-common \
            python3.9 python3.9-venv python3.9-distutils
          python3.9 --version
  
          # 为 Python 3.9 安装 pip（>=3.9 可用通用 get-pip.py）
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3.9 /tmp/get-pip.py --ignore-installed
          python3.9 -m pip --version
  
          # 让后续步骤继续用 python/pip 命令（与你原模板兼容）
          update-alternatives --install /usr/bin/python python /usr/bin/python3.9 1
          update-alternatives --install /usr/bin/pip pip "$(command -v pip3)" 1
          python --version
          pip --version
      # ====== 替换结束 ======
  
      - name: Setup Node.js
        run: |
          # 容器内自行装 Node 20（setup-node 在 job container 下不如直接装稳）
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version
  
      - name: Print pip index/config (debug)
        run: |
          set -x
          python -m pip config list -v || true
          python -m pip debug -v | sed -n '/Index URLs/,+30p' || true
          env | grep -E '^PIP_' || true
  
      - name: Install Python dependencies
        working-directory: package
        run: |
          python -m pip install --upgrade pip
          # 强制官方 PyPI，避免镜像不同步导致版本缺失
          pip install --index-url https://pypi.org/simple -r requirements.txt
  
      - name: Install frontend dependencies
        working-directory: package/frontend
        run: npm ci
  
      - name: Build frontend
        working-directory: package/frontend
        run: npm run build
  
      - name: Copy frontend build to static
        working-directory: package
        run: |
          rm -rf static
          cp -r frontend/dist static
  
      - name: Build with PyInstaller
        working-directory: package
        run: pyinstaller app.spec --clean

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
